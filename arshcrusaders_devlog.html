<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ArshCrusaders — Development Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0612; --bg2:#13101e;
  --gold:#d4a44a; --goldL:#f0cc72; --goldD:#7c5a1f;
  --crusader:#c0392b; --crusaderL:#e74c3c;
  --border:rgba(212,164,74,.22); --border2:rgba(212,164,74,.5);
  --ink:#e8dfc8; --ink2:rgba(232,223,200,.82); --muted:rgba(232,223,200,.55); --mute2:rgba(232,223,200,.35);
  --bad:#f87171; --good:#86efac; --info:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'EB Garamond',serif;background:radial-gradient(ellipse at top,#1a1428 0%,var(--bg) 60%,var(--bg2) 100%);color:var(--ink);min-height:100vh;padding:24px 18px 100px;line-height:1.6;}
.head{max-width:1000px;margin:0 auto 24px;text-align:center;padding-bottom:18px;border-bottom:1px solid var(--border);position:relative;}
.head::before{content:'';position:absolute;bottom:-1px;left:50%;width:240px;height:2px;background:linear-gradient(90deg,transparent,var(--crusader),transparent);transform:translateX(-50%);}
.head h1{font-family:'Cinzel Decorative',serif;color:var(--goldL);font-size:clamp(28px,5.5vw,40px);letter-spacing:.06em;text-shadow:0 2px 12px rgba(192,57,43,.15);}
.head .sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);font-size:14px;margin-top:6px;}
.head .crest{font-family:'Cinzel',serif;color:var(--crusader);font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-top:10px;}

.container{max-width:1000px;margin:0 auto;}

/* External link cards (always visible) */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:24px;}
.link-card{display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(180deg,rgba(192,57,43,.06),rgba(0,0,0,.22));border:1px solid var(--border);border-left:4px solid var(--crusader);border-radius:4px;text-decoration:none;color:var(--ink);transition:all .15s;}
.link-card.youtube{border-left-color:#ff0033;background:linear-gradient(180deg,rgba(255,0,51,.05),rgba(0,0,0,.22));}
.link-card:hover{transform:translateX(3px);box-shadow:0 4px 16px rgba(192,57,43,.18);}
.link-card.youtube:hover{box-shadow:0 4px 16px rgba(255,0,51,.18);}
.link-icon{font-size:32px;flex-shrink:0;}
.link-body{flex:1;min-width:0;}
.link-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
.link-title{font-family:'Cinzel',serif;color:var(--goldL);font-size:15px;letter-spacing:.04em;margin-top:2px;}
.link-url{color:var(--muted);font-size:11px;font-style:italic;margin-top:3px;word-break:break-all;}
.link-arrow{color:var(--gold);font-size:18px;flex-shrink:0;}

/* Project snapshot */
.snap{background:linear-gradient(180deg,rgba(192,57,43,.05),rgba(0,0,0,.22));border:1px solid var(--border);border-radius:4px;padding:18px 22px;margin-bottom:24px;}
.snap-h{font-family:'Cinzel',serif;color:var(--crusaderL);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:14px;text-align:center;}
.snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px;}
.snap-item{padding:8px 0;border-bottom:1px dashed rgba(212,164,74,.12);}
.snap-lbl{font-family:'Cinzel',serif;font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;}
.snap-val{font-family:'EB Garamond',serif;color:var(--goldL);font-size:14px;}
.snap-rm{display:none;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;}
body.editing .snap-rm{display:inline;}
.snap-add{display:none;margin-top:12px;gap:6px;align-items:center;}
body.editing .snap-add{display:flex;}
.snap-add input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:2px;font-size:12px;}
.snap-add button{padding:6px 12px;font-size:10px;font-family:'Cinzel',serif;letter-spacing:.1em;background:rgba(212,164,74,.1);color:var(--goldL);border:1px solid var(--border);border-radius:2px;cursor:pointer;}

/* Toolbar (edit only) */
.toolbar{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px;padding:10px 0;border-bottom:1px solid var(--border);}
body.editing .toolbar{display:flex;}
.toolbar h2{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldL);margin-right:auto;}
.toolbar button{padding:7px 14px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(212,164,74,.1);color:var(--goldL);border:1px solid var(--border2);border-radius:3px;cursor:pointer;}
.toolbar button.primary{background:rgba(192,57,43,.2);color:var(--crusaderL);border-color:rgba(192,57,43,.4);}
.toolbar button.bad{background:rgba(248,113,113,.1);color:var(--bad);border-color:rgba(248,113,113,.3);}

/* Devlog entries */
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--gold),transparent);opacity:.4;}
.entry{position:relative;background:linear-gradient(180deg,rgba(212,164,74,.04),rgba(0,0,0,.22));border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:4px;padding:14px 18px;margin-bottom:16px;}
.entry::before{content:'';position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--border);}
.entry.major{border-left-color:var(--crusader);}
.entry.major::before{background:var(--crusader);}
.entry.feature{border-left-color:var(--good);}
.entry.feature::before{background:var(--good);}
.entry.bug{border-left-color:var(--bad);}
.entry.bug::before{background:var(--bad);}
.entry-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.entry-ver{font-family:'Cinzel',serif;color:var(--goldL);background:rgba(212,164,74,.12);border:1px solid var(--border);padding:3px 10px;border-radius:2px;font-size:12px;letter-spacing:.06em;}
.entry-date{color:var(--muted);font-size:12px;font-style:italic;}
.entry-type{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute2);}
.entry-title{flex:1;min-width:180px;font-family:'Cinzel',serif;color:var(--goldL);font-size:15px;letter-spacing:.04em;}
.entry-body{color:var(--ink2);font-size:13.5px;line-height:1.65;white-space:pre-wrap;}
.entry-edit{display:none;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
body.editing .entry-edit{display:flex;}
body.editing .entry-head{display:none;}
body.editing .entry-body-view{display:none;}
.entry-edit input,.entry-edit select{background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:2px;font-family:'EB Garamond',serif;font-size:12px;}
.entry-edit .e-ver{width:90px;}
.entry-edit .e-date{width:130px;}
.entry-edit .e-type{width:120px;}
.entry-edit .e-kind{width:100px;}
.entry-edit .e-title{flex:1;min-width:180px;font-family:'Cinzel',serif;color:var(--goldL);font-size:14px;}
textarea.entry-body-edit{display:none;width:100%;min-height:100px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:2px;color:var(--ink2);padding:8px 10px;font-family:'EB Garamond',serif;font-size:13px;line-height:1.55;resize:vertical;}
body.editing textarea.entry-body-edit{display:block;}
.entry-actions{display:none;gap:6px;margin-top:8px;flex-wrap:wrap;}
body.editing .entry-actions{display:flex;}
.entry-actions button{padding:5px 9px;font-size:10px;background:rgba(212,164,74,.08);color:var(--goldL);border:1px solid var(--border);border-radius:2px;cursor:pointer;font-family:'Cinzel',serif;letter-spacing:.06em;}
.entry-actions button.bad{background:rgba(248,113,113,.08);color:var(--bad);border-color:rgba(248,113,113,.3);}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-style:italic;}

/* Pencil FAB */
.fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldD));color:#1a1428;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(212,164,74,.4),inset 0 1px 0 rgba(255,255,255,.3);font-size:24px;display:flex;align-items:center;justify-content:center;z-index:50;transition:all .2s;}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 24px rgba(212,164,74,.55);}
body.editing .fab{background:linear-gradient(135deg,var(--good),#3b9d68);}
body.editing .fab .pencil{display:none;}
.fab .check{display:none;}
body.editing .fab .check{display:inline;}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(20,15,28,.95);border:1px solid var(--gold);color:var(--ink);padding:10px 20px;border-radius:4px;font-size:13px;z-index:100;display:none;}
.toast.show{display:block;animation:fadeOut 2s ease-in forwards;}
@keyframes fadeOut{0%,60%{opacity:1;}100%{opacity:0;}}
.section-h{font-family:'Cinzel',serif;color:var(--goldL);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:14px 0 12px;border-bottom:1px solid var(--border);padding-bottom:6px;}
</style>
<style id="arsh-gate-base"></style>
<script>
/* ════ ARSH ADMIN GATE ════
   Editing the Archive is reserved for the Keeper (Aelarion).
   Readers see the pages in view-only form. This is an editing lock,
   shared across pages via localStorage('arsh_admin'). */
(function(){
  var SEL='.fab,.ep-fab,.ep-sadd';
  function admin(){try{return localStorage.getItem('arsh_admin')==='1';}catch(e){return false;}}
  function mark(){
    if(!document.body||document.getElementById('arsh-viewlock'))return;
    var d=document.createElement('div');d.id='arsh-viewlock';d.textContent='\uD83D\uDD12 View only';
    d.style.cssText='position:fixed;bottom:16px;right:16px;z-index:2147483000;font-family:Cinzel,Georgia,serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,164,74,.55);background:rgba(10,6,16,.72);border:1px solid rgba(212,164,74,.22);border-radius:20px;padding:6px 12px;pointer-events:none;';
    document.body.appendChild(d);
  }
  function unmark(){var d=document.getElementById('arsh-viewlock');if(d)d.remove();}
  function apply(){
    var st=document.getElementById('arsh-gate-base'),on=admin();
    document.documentElement.setAttribute('data-arsh-role',on?'keeper':'reader');
    if(on){if(st)st.textContent='';unmark();return;}
    if(st)st.textContent=SEL+'{display:none!important;}';
    if(document.body)mark();else document.addEventListener('DOMContentLoaded',mark);
  }
  apply();
  window.addEventListener('storage',function(e){if(e.key==='arsh_admin'||e.key===null)apply();});
  document.addEventListener('DOMContentLoaded',apply);
})();
</script>
</head>
<body>

<div class="head">
  <h1>ArshCrusaders</h1>
  <div class="sub">CK3 Total Conversion — States of Exelia</div>
  <div class="crest">Development Log</div>
</div>

<div class="container">

  <div class="links">
    <a class="link-card" href="https://mods.paradoxplaza.com/mods/134789/Any" target="_blank" rel="noopener">
      <div class="link-icon">&#9876;</div>
      <div class="link-body">
        <div class="link-lbl">Paradox Mod Page</div>
        <div class="link-title">ArshCrusaders on Paradox Mods</div>
        <div class="link-url">mods.paradoxplaza.com/mods/134789/Any</div>
      </div>
      <div class="link-arrow">&rarr;</div>
    </a>
    <a class="link-card youtube" href="https://www.youtube.com/@NobilisAelarionWarren" target="_blank" rel="noopener">
      <div class="link-icon">&#9654;</div>
      <div class="link-body">
        <div class="link-lbl">YouTube Channel</div>
        <div class="link-title">@NobilisAelarionWarren</div>
        <div class="link-url">youtube.com/@NobilisAelarionWarren</div>
      </div>
      <div class="link-arrow">&rarr;</div>
    </a>
  </div>

  <div class="snap">
    <div class="snap-h">Project Snapshot</div>
    <div class="snap-grid" id="snap-grid"></div>
    <div class="snap-add">
      <input id="newSnapK" placeholder="New label (e.g. Lines of Code)">
      <button onclick="addSnapKey()">+ Add</button>
    </div>
  </div>

  <div class="toolbar">
    <h2>Edit Devlog</h2>
    <button class="primary" onclick="addEntry()">+ New Entry</button>
    <button onclick="exportData()">Export</button>
    <button onclick="document.getElementById('imp').click()">Import</button>
    <button class="bad" onclick="resetAll()">Reset</button>
    <input type="file" id="imp" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <div class="section-h">Development Timeline</div>
  <div class="timeline" id="entryList"></div>
</div>

<button class="fab" onclick="toggleEdit()" title="Toggle edit mode"><span class="pencil">&#9998;</span><span class="check">&#10003;</span></button>
<div class="toast" id="toast"></div>

<script>
var KEY="arshcrusaders_devlog_v2",STATE=null,EDIT_MODE=false;
var DEFAULT={
  meta:{
    "Project Name":"ArshCrusaders / States of Exelia",
    "Base Game":"Crusader Kings III",
    "Current Version":"0.4.2+",
    "Map Status":"South Imvia and Armorica complete",
    "Roadmap":"v0.5 → v10.5 (Revolution, Magic, Diarchy, Confederationalist, EU5 bridge)",
    "Status":"Active development"
  },
  entries:[
    {ver:"0.4.2", date:"2026-04", type:"Milestone", title:"South Imvia & Armorica complete", kind:"feature",
     body:"Two major regions of the Exelian continent are now fully playable with provinces, cultures, religions, and dynasty data. Province definitions in /map_data/definition.csv, culture files in /common/culture/cultures/, religion files in /common/religion/religions/.\n\nKnown issues:\n- A few culture portraits still falling back to defaults — DNA strings need extending for Karun and Chamalian.\n- Some baronies under Armorican Crown still have placeholder names."},
    {ver:"0.4.1", date:"2026-03", type:"Patch", title:"Elder Republic government type", kind:"feature",
     body:"Custom government type now in /common/governments/. Council seats, elder voting mechanic, and faction support tied to standing. Decisions to convene the Elder Council and to dissolve it.\n\nNeeds testing: succession when the Elder dies mid-term — currently rolls to the second-ranked councillor by support, but the AI sometimes ignores its own laws."},
    {ver:"0.4.0", date:"2026-02", type:"Milestone", title:"Cultures, religions, and tenets first pass", kind:"feature",
     body:"Àsturian, Karun, and Chamalian cultures added with full tradition sets. Old Faith tenets for sun and crescent worship. Imperial Theurgy religion with persecution mechanics against Hemomancers.\n\nDocs: see /docs/cultures.md for the design notes."},
    {ver:"0.3.x", date:"2026-01", type:"Bugfix", title:"Error log cleanup", kind:"bug",
     body:"Cleared ~200 lines of warnings around missing localization keys for newly added titles. Dynasty localisation pass for Imvien and Sofkarr families. Holy site coordinates re-checked."}
  ]
};

function load(){try{var r=localStorage.getItem(KEY);if(r){STATE=JSON.parse(r);return;}}catch(e){}STATE=JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){toast("Save failed");}}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function renderSnap(){
  var el=document.getElementById("snap-grid"),html="",keys=Object.keys(STATE.meta);
  for(var i=0;i<keys.length;i++){var k=keys[i];
    html+='<div class="snap-item">'
      +'<div class="snap-lbl">'+esc(k)+' <button class="snap-rm" onclick="delMetaKey(\''+k.replace(/'/g,"\\'")+'\')">&times;</button></div>';
    if(EDIT_MODE){
      html+='<input style="width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--goldL);padding:5px 8px;border-radius:2px;font-size:13px" value="'+esc(STATE.meta[k])+'" oninput="updMeta(\''+k.replace(/'/g,"\\'")+'\',this.value)">';
    } else {
      html+='<div class="snap-val">'+esc(STATE.meta[k]||"—")+'</div>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
}
function updMeta(k,v){STATE.meta[k]=v;save();}
function addSnapKey(){var k=document.getElementById("newSnapK").value.trim();if(!k)return;STATE.meta[k]="";document.getElementById("newSnapK").value="";save();renderSnap();}
function delMetaKey(k){delete STATE.meta[k];save();renderSnap();}

function renderEntries(){
  var el=document.getElementById("entryList");
  if(!STATE.entries.length){el.innerHTML='<div class="empty">No entries yet. Toggle edit mode and tap <strong>+ New Entry</strong>.</div>';return;}
  var html="";
  for(var i=0;i<STATE.entries.length;i++){var e=STATE.entries[i];
    var cls=(e.kind||"");if(e.type==="Milestone")cls+=" major";
    html+='<div class="entry '+cls+'">'
      +'<div class="entry-head">'
        +'<span class="entry-ver">'+esc(e.ver||"v?")+'</span>'
        +'<span class="entry-date">'+esc(e.date||"")+'</span>'
        +'<span class="entry-type">'+esc(e.type||"Note")+'</span>'
        +'<span class="entry-title">'+esc(e.title||"")+'</span>'
      +'</div>'
      +'<div class="entry-edit">'
        +'<input class="e-ver" value="'+esc(e.ver)+'" oninput="updE('+i+',\'ver\',this.value)" placeholder="v0.0">'
        +'<input class="e-date" value="'+esc(e.date)+'" oninput="updE('+i+',\'date\',this.value)" placeholder="YYYY-MM">'
        +'<select class="e-type" onchange="updE('+i+',\'type\',this.value)">'
          +'<option'+(e.type==="Milestone"?" selected":"")+'>Milestone</option>'
          +'<option'+(e.type==="Feature"?" selected":"")+'>Feature</option>'
          +'<option'+(e.type==="Patch"?" selected":"")+'>Patch</option>'
          +'<option'+(e.type==="Bugfix"?" selected":"")+'>Bugfix</option>'
          +'<option'+(e.type==="Note"?" selected":"")+'>Note</option>'
        +'</select>'
        +'<select class="e-kind" onchange="updE('+i+',\'kind\',this.value);renderEntries()">'
          +'<option value=""'+(!e.kind?" selected":"")+'>Default</option>'
          +'<option value="feature"'+(e.kind==="feature"?" selected":"")+'>Feature</option>'
          +'<option value="bug"'+(e.kind==="bug"?" selected":"")+'>Bug</option>'
        +'</select>'
        +'<input class="e-title" value="'+esc(e.title)+'" oninput="updE('+i+',\'title\',this.value)" placeholder="Headline">'
      +'</div>'
      +'<div class="entry-body-view">'+esc(e.body||"")+'</div>'
      +'<textarea class="entry-body-edit" oninput="updE('+i+',\'body\',this.value)" placeholder="What changed, what to test, what to dig into next...">'+esc(e.body)+'</textarea>'
      +'<div class="entry-actions">'
        +'<button onclick="moveE('+i+',-1)">&uarr; Newer</button>'
        +'<button onclick="moveE('+i+',1)">&darr; Older</button>'
        +'<button class="bad" onclick="delE('+i+')">Remove</button>'
      +'</div>'
    +'</div>';
  }
  el.innerHTML=html;
}
function updE(i,k,v){STATE.entries[i][k]=v;save();}
function addEntry(){var n=new Date(),ym=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");STATE.entries.unshift({ver:"",date:ym,type:"Feature",title:"New entry",body:"",kind:""});save();renderEntries();window.scrollTo(0,document.querySelector(".section-h").offsetTop);}
function moveE(i,d){var nx=i+d;if(nx<0||nx>=STATE.entries.length)return;var t=STATE.entries[i];STATE.entries[i]=STATE.entries[nx];STATE.entries[nx]=t;save();renderEntries();}
function delE(i){if(!confirm("Remove this entry?"))return;STATE.entries.splice(i,1);save();renderEntries();}
function exportData(){var d=JSON.stringify(STATE,null,2),bl=new Blob([d],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="arshcrusaders_devlog.json";a.click();toast("Exported.");}
function importData(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!d.entries||!d.meta)throw new Error();STATE=d;save();renderSnap();renderEntries();toast("Imported.");}catch(err){toast("Import failed");}};r.readAsText(f);ev.target.value="";}
function resetAll(){if(!confirm("Reset?"))return;localStorage.removeItem(KEY);load();renderSnap();renderEntries();toast("Reset.");}
function toggleEdit(){EDIT_MODE=!EDIT_MODE;document.body.classList.toggle("editing",EDIT_MODE);renderSnap();renderEntries();toast(EDIT_MODE?"Edit mode on":"Edit mode off");}
var toastTm;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");if(toastTm)clearTimeout(toastTm);toastTm=setTimeout(function(){t.classList.remove("show");},2200);}
load();renderSnap();renderEntries();
</script>
</body>
</html>
