:root{

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'EB Garamond',serif;background:radial-gradient(ellipse at top,#1a1428 0%,var(--bg) 60%,var(--bg2) 100%);color:var(--ink);min-height:100vh;padding:24px 18px 100px;line-height:1.55;}
.head{max-width:1000px;margin:0 auto 28px;text-align:center;padding-bottom:22px;border-bottom:1px solid var(--border);position:relative;}
.head::before{content:'';position:absolute;bottom:-1px;left:50%;width:240px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:translateX(-50%);}
.head h1{font-family:'Cinzel Decorative',serif;color:var(--goldL);font-size:clamp(28px,5.5vw,42px);letter-spacing:.04em;text-shadow:0 2px 12px rgba(212,164,74,.18);}
.head .sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);font-size:15px;margin-top:10px;max-width:560px;margin-left:auto;margin-right:auto;}
.tabs{max-width:1000px;margin:0 auto 22px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tabs button{padding:9px 18px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;}
.tabs button.active{background:rgba(212,164,74,.16);color:var(--goldL);border-color:var(--gold);}
.tabs button:hover{color:var(--ink);}
.container{max-width:1000px;margin:0 auto;}
.pane{display:none;}
.pane.active{display:block;}
.toolbar{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px;padding:10px 0;border-bottom:1px solid var(--border);}
body.editing .toolbar{display:flex;}
.toolbar h2{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldL);margin-right:auto;}
.toolbar button{padding:7px 14px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(212,164,74,.1);color:var(--goldL);border:1px solid var(--border2);border-radius:3px;cursor:pointer;}
.toolbar button.primary{background:rgba(212,164,74,.25);}
.toolbar button.bad{background:rgba(248,113,113,.1);color:var(--bad);border-color:rgba(248,113,113,.3);}
.toolbar button:hover{filter:brightness(1.18);}
body.editing .view-only{display:none!important;}
.pub-intro{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);font-size:14px;text-align:center;margin-bottom:22px;max-width:680px;margin-left:auto;margin-right:auto;}
.pub-list{display:flex;flex-direction:column;gap:6px;}
.pubrow{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:13px 18px;background:linear-gradient(90deg,rgba(212,164,74,.04),rgba(0,0,0,.18));border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:3px;transition:all .15s;}
.pubrow:hover{border-left-color:var(--goldL);background:linear-gradient(90deg,rgba(212,164,74,.08),rgba(0,0,0,.18));}
.pub-n{font-family:'Cinzel Decorative',serif;color:var(--gold);font-size:22px;text-align:center;}
.pub-body{min-width:0;}
.pub-title{font-family:'Cinzel',serif;color:var(--goldL);font-size:15px;letter-spacing:.05em;margin-bottom:2px;}
.pub-when{font-family:'Cormorant Garamond',serif;color:var(--muted);font-size:13px;font-style:italic;}
.pub-note{color:var(--ink2);font-size:12px;font-style:italic;margin-top:3px;display:none;}
body.editing .pub-note{display:block;}
.pub-actions{display:none;gap:4px;flex-shrink:0;}
body.editing .pub-actions{display:flex;}
.pub-actions button{padding:5px 9px;font-size:12px;background:rgba(212,164,74,.08);color:var(--goldL);border:1px solid var(--border);border-radius:2px;cursor:pointer;}

.pub-actions button:hover{background:rgba(212,164,74,.22);}
.plan-divider{text-align:center;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin:24px 0 12px;padding-top:14px;border-top:1px dashed var(--border);opacity:.7;}

.add-book:hover{background:rgba(212,164,74,.05);color:var(--goldL);}
.era-edit-h{display:none;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}

input.tin,select.tin,textarea.tin{background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--ink);padding:6px 8px;border-radius:2px;font-family:'EB Garamond',serif;font-size:13px;width:100%;}

.fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldD));color:#1a1428;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(212,164,74,.4),inset 0 1px 0 rgba(255,255,255,.3);font-size:24px;display:flex;align-items:center;justify-content:center;z-index:50;transition:all .2s;}

.fab .check{display:none;}
body.editing .fab .pencil{display:none;}
body.editing .fab .check{display:inline;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(20,15,28,.95);border:1px solid var(--gold);color:var(--ink);padding:10px 20px;border-radius:4px;font-size:13px;z-index:100;display:none;}
.toast.show{display:block;animation:fadeOut 2s ease-in forwards;}
@keyframes fadeOut{0%,60%{opacity:1;}100%{opacity:0;}}

<style id="arsh-gate-base"></style>
<script>
/* ════ ARSH ADMIN GATE ════
   Editing the Archive is reserved for the Keeper (Aelarion).
   Readers see the pages in view-only form. This is an editing lock,
   shared across pages via localStorage('arsh_admin'). */
(function(){
  var SEL='.fab,.ep-fab,.ep-sadd';
  function admin(){try{return localStorage.getItem('arsh_admin')==='1';}catch(e){return false;}}
  function mark(){
    if(!document.body||document.getElementById('arsh-viewlock'))return;
    var d=document.createElement('div');d.id='arsh-viewlock';d.textContent='\uD83D\uDD12 View only';
    d.style.cssText='position:fixed;bottom:16px;right:16px;z-index:2147483000;font-family:Cinzel,Georgia,serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,164,74,.55);background:rgba(10,6,16,.72);border:1px solid rgba(212,164,74,.22);border-radius:20px;padding:6px 12px;pointer-events:none;';
    document.body.appendChild(d);
  }
  function unmark(){var d=document.getElementById('arsh-viewlock');if(d)d.remove();}
  function apply(){
    var st=document.getElementById('arsh-gate-base'),on=admin();
    document.documentElement.setAttribute('data-arsh-role',on?'keeper':'reader');
    if(on){if(st)st.textContent='';unmark();return;}
    if(st)st.textContent=SEL+'{display:none!important;}';
    if(document.body)mark();else document.addEventListener('DOMContentLoaded',mark);
  }
  apply();
  window.addEventListener('storage',function(e){if(e.key==='arsh_admin'||e.key===null)apply();});
  document.addEventListener('DOMContentLoaded',apply);
})();
</script>

  ]
};
var SECTION_LABELS={empire:"Stage I — Empire (the foundation)",after:"Stage II — After Empire",before:"Stage III — Before Empire (foundational myth)",new:"Stage IV — The New Era",war:"Stage V — The War of Two Houses",early:"Stage VI — Early Standalones",genocide:"Stage VII — The Genocides Duology",frontier:"Stage VIII — Frontier",coalition:"Stage IX — The Coalition War (prelude)",compendium:"Stage X — Compendiums"};
function load(){try{var r=localStorage.getItem(KEY);if(r){STATE=JSON.parse(r);return;}}catch(e){}STATE=JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){toast("Save failed");}}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function renderPub(){
  var el=document.getElementById("pubList"),html="",prev=null;
  for(var i=0;i<STATE.pub.length;i++){var p=STATE.pub[i];
    if(p.section&&p.section!==prev&&SECTION_LABELS[p.section]&&!EDIT_MODE){html+='<div class="plan-divider">'+SECTION_LABELS[p.section]+'</div>';prev=p.section;}else if(EDIT_MODE){prev=p.section;}
    html+='<div class="pubrow"><div class="pub-n">'+(i+1)+'</div><div class="pub-body">';
    if(EDIT_MODE){
      html+='<input class="tin" style="background:transparent;border:none;border-bottom:1px dashed var(--border);font-family:Cinzel,serif;color:var(--goldL);font-size:14px;padding:2px 0" value="'+esc(p.title)+'" oninput="updPub('+i+',\'title\',this.value)" placeholder="Title">';
      html+='<input class="tin" style="background:transparent;border:none;border-bottom:1px dashed var(--border);font-style:italic;color:var(--muted);font-size:12px;padding:2px 0;margin-top:3px" value="'+esc(p.when)+'" oninput="updPub('+i+',\'when\',this.value)" placeholder="When / volume">';
    } else {
      html+='<div class="pub-title">'+esc(p.title)+'</div><div class="pub-when">'+esc(p.when||"—")+'</div>';
    }
    html+='<div class="pub-note">'+(EDIT_MODE?'<input class="tin" style="font-style:italic;font-size:12px;margin-top:4px" value="'+esc(p.note)+'" oninput="updPub('+i+',\'note\',this.value)" placeholder="Note">':esc(p.note))+'</div>';
    html+='</div><div class="pub-actions"><button onclick="movePub('+i+',-1)">&uarr;</button><button onclick="movePub('+i+',1)">&darr;</button><button class="bad" onclick="delPub('+i+')">&times;</button></div></div>';
  }
  el.innerHTML=html;
}
function renderEras(){
  var el=document.getElementById("eraList"),html="";
  for(var e=0;e<STATE.eras.length;e++){var era=STATE.eras[e];
    html+='<div class="era">';
    if(EDIT_MODE){
      html+='<div class="era-edit-h"><input class="tin" style="font-family:Cinzel,serif;color:var(--goldL);font-size:18px" value="'+esc(era.name)+'" oninput="updEra('+e+',\'name\',this.value)" placeholder="Era name">';
      html+='<button class="bad" onclick="delEra('+e+')" style="padding:6px 10px;background:rgba(248,113,113,.08);color:var(--bad);border:1px solid rgba(248,113,113,.3);border-radius:2px;cursor:pointer;font-family:Cinzel,serif;font-size:10px;letter-spacing:.1em">Remove Era</button></div>';
      html+='<input class="tin" style="font-style:italic;color:var(--muted);font-size:13px;margin-bottom:6px" value="'+esc(era.tag)+'" oninput="updEra('+e+',\'tag\',this.value)" placeholder="Subtitle">';
      html+='<textarea class="tin" style="font-style:italic;color:var(--ink2);font-size:13px;margin-bottom:14px" oninput="updEra('+e+',\'desc\',this.value)" placeholder="Description">'+esc(era.desc)+'</textarea>';
    } else {
      html+='<div class="era-h">'+esc(era.name)+'</div><div class="era-tag">'+esc(era.tag)+'</div><div class="era-rule"></div>'+(era.desc?'<div class="era-desc">'+esc(era.desc)+'</div>':"");
    }
    html+='<div class="books">';
    for(var b=0;b<era.books.length;b++){var bk=era.books[b];
      html+='<div class="book"><div class="book-status-badge" data-st="'+(bk.status||"planned")+'">'+(bk.status||"planned")+'</div>';
      if(EDIT_MODE){
        html+='<input class="tin" style="font-family:Cinzel,serif;color:var(--goldL);font-size:13px;margin-bottom:4px" value="'+esc(bk.title)+'" oninput="updBook('+e+','+b+',\'title\',this.value)" placeholder="Title">';
        html+='<input class="tin" style="font-style:italic;color:var(--gold);font-size:11px;margin-bottom:6px" value="'+esc(bk.type)+'" oninput="updBook('+e+','+b+',\'type\',this.value)" placeholder="Type">';
        html+='<select class="tin" style="margin-bottom:6px" onchange="updBook('+e+','+b+',\'status\',this.value);renderEras()"><option value="planned"'+(bk.status==="planned"?" selected":"")+'>Planned</option><option value="drafting"'+(bk.status==="drafting"?" selected":"")+'>Drafting</option><option value="published"'+(bk.status==="published"?" selected":"")+'>Published</option></select>';
        html+='<textarea class="tin" oninput="updBook('+e+','+b+',\'syn\',this.value)" placeholder="Synopsis">'+esc(bk.syn)+'</textarea>';
      } else {
        html+='<div class="book-title">'+esc(bk.title)+'</div>'+(bk.type?'<div class="book-type">'+esc(bk.type)+'</div>':"")+(bk.syn?'<div class="book-syn">'+esc(bk.syn)+'</div>':"");
      }
      html+='<div class="book-actions"><button onclick="moveBook('+e+','+b+',-1)">&uarr;</button><button onclick="moveBook('+e+','+b+',1)">&darr;</button><button class="bad" onclick="delBook('+e+','+b+')">Remove</button></div></div>';
    }
    html+='</div><button class="add-book" onclick="addBook('+e+')">+ Add Book</button></div>';
  }
  el.innerHTML=html;
}
function updPub(i,k,v){STATE.pub[i][k]=v;save();}
function updEra(i,k,v){STATE.eras[i][k]=v;save();}
function updBook(e,b,k,v){STATE.eras[e].books[b][k]=v;save();}
function addPubItem(){STATE.pub.push({title:"New entry",when:"",note:"",section:""});save();renderPub();}
function movePub(i,d){var nx=i+d;if(nx<0||nx>=STATE.pub.length)return;var t=STATE.pub[i];STATE.pub[i]=STATE.pub[nx];STATE.pub[nx]=t;save();renderPub();}
function delPub(i){if(!confirm("Remove?"))return;STATE.pub.splice(i,1);save();renderPub();}
function addEra(){STATE.eras.push({name:"New Era",tag:"",desc:"",books:[]});save();renderEras();}
function delEra(e){if(!confirm("Remove era and all books?"))return;STATE.eras.splice(e,1);save();renderEras();}
function addBook(e){STATE.eras[e].books.push({title:"New book",type:"",status:"planned",syn:""});save();renderEras();}
function moveBook(e,b,d){var bs=STATE.eras[e].books,nx=b+d;if(nx<0||nx>=bs.length)return;var t=bs[b];bs[b]=bs[nx];bs[nx]=t;save();renderEras();}
function delBook(e,b){if(!confirm("Remove book?"))return;STATE.eras[e].books.splice(b,1);save();renderEras();}
function exportData(){var d=JSON.stringify(STATE,null,2),bl=new Blob([d],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="arshmunnu_publications.json";a.click();toast("Exported.");}
function importData(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!d.pub||!d.eras)throw new Error();STATE=d;save();renderPub();renderEras();toast("Imported.");}catch(err){toast("Import failed");}};r.readAsText(f);ev.target.value="";}
function resetAll(){if(!confirm("Reset?"))return;localStorage.removeItem(KEY);load();renderPub();renderEras();toast("Reset.");}
function toggleEdit(){EDIT_MODE=!EDIT_MODE;document.body.classList.toggle("editing",EDIT_MODE);renderPub();renderEras();toast(EDIT_MODE?"Edit mode on":"Edit mode off");}
var toastTm;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");if(toastTm)clearTimeout(toastTm);toastTm=setTimeout(function(){t.classList.remove("show");},2200);}
document.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("active",x===b);});document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("active",p.id==="pane-"+b.dataset.tab);});});});
load();renderPub();renderEras();
</script>
</body>
</html>
