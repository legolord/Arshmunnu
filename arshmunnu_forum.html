<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Commons — Forum of the Custodians</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06040e;--text:#e6dfcf;--muted:#928c9e;--mute2:#5b566a;
  --gold:#c9a84c;--goldL:#f0cc72;--goldD:#7c5a1f;
  --border:rgba(201,168,76,.14);--border2:rgba(201,168,76,.3);
  --forum:#cf7d63;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{font-family:'EB Garamond',serif;color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(1100px 520px at 80% -8%,rgba(207,125,99,.10),transparent 55%),
    radial-gradient(900px 520px at 8% 4%,rgba(147,112,176,.08),transparent 55%),
    radial-gradient(1000px 600px at 50% 120%,rgba(201,168,74,.06),transparent 55%),
    var(--bg);}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:0 20px 120px;}
a{color:inherit;}

/* HERO */
.hero{padding:54px 0 22px;text-align:center;position:relative;}
.hero .eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--goldD);margin-bottom:16px;}
.hero h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(36px,7.5vw,76px);line-height:.95;
  background:linear-gradient(180deg,#f6dd9a,#cf9d6a 50%,#7c5a1f);-webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.02em;filter:drop-shadow(0 2px 18px rgba(207,125,99,.2));}
.hero .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(16px,2.4vw,21px);color:var(--muted);margin-top:14px;}
.hero .rule{width:120px;height:1px;margin:24px auto 0;background:linear-gradient(90deg,transparent,var(--border2),transparent);position:relative;}
.hero .rule::after{content:"\2756";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--goldD);font-size:13px;background:var(--bg);padding:0 10px;}

.home-link{position:absolute;top:20px;left:0;display:inline-flex;align-items:center;gap:8px;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  padding:8px 14px;border:1px solid var(--border);border-radius:3px;background:rgba(201,168,74,.04);transition:all .16s;}
.home-link:hover{color:var(--goldL);border-color:var(--border2);}

/* IDENTITY STRIP */
.whoami{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px auto 0;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);}
.whoami .seal{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:#1a0800;
  background:radial-gradient(circle at 35% 30%,#f0cc72,#cf9d6a 55%,#7c5a1f);box-shadow:0 0 0 1px #7c5a1f;}
.whoami b{font-style:normal;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.04em;color:var(--goldL);font-weight:600;}
.whoami .keeper{color:var(--forum);}
.whoami .setname{font-family:'Cinzel',serif;font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldD);
  border:1px solid var(--border);border-radius:3px;padding:4px 9px;cursor:pointer;background:rgba(201,168,74,.04);transition:all .15s;}
.whoami .setname:hover{color:var(--goldL);border-color:var(--border2);}

/* SECTION HEADER */
.sec-h{display:flex;align-items:center;gap:14px;margin:40px 0 18px;}
.sec-h .stitle{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--goldL);white-space:nowrap;}
.sec-h .sline{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent);}
.sec-h .scount{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;color:var(--goldD);}

/* HALL CARDS */
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.hall{position:relative;display:flex;gap:15px;align-items:flex-start;padding:18px;cursor:pointer;overflow:hidden;
  background:linear-gradient(155deg,rgba(22,18,30,.92),rgba(12,10,18,.82));
  border:1px solid var(--border);border-radius:9px;transition:transform .18s,border-color .18s,box-shadow .18s;--c:var(--gold);}
.hall::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.6;transition:opacity .18s,width .18s;}
.hall:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 14px 38px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--c) 20%,transparent);}
.hall:hover::before{opacity:1;width:4px;}
.hall-ic{width:46px;height:46px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 10%,transparent));
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--c);}
.hall-body{flex:1;min-width:0;}
.hall-name{font-family:'Cinzel',serif;font-size:15px;color:var(--text);letter-spacing:.03em;}
.hall-desc{font-family:'Cormorant Garamond',serif;font-size:14.5px;color:var(--muted);line-height:1.4;margin-top:6px;}
.hall-meta{margin-top:10px;font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldD);display:flex;gap:14px;flex-wrap:wrap;}
.hall-meta .last{color:var(--mute2);text-transform:none;letter-spacing:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5px;}

/* THREAD LIST */
.crumb{display:flex;align-items:center;gap:10px;margin:30px 0 6px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.crumb .back{cursor:pointer;border:1px solid var(--border);border-radius:3px;padding:7px 12px;background:rgba(201,168,74,.04);transition:all .15s;color:var(--muted);}
.crumb .back:hover{color:var(--goldL);border-color:var(--border2);}
.crumb .crumb-here{color:var(--goldL);}
.crumb .dot{color:var(--goldD);}

.board-title{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(26px,4.5vw,40px);color:var(--goldL);margin:8px 0 2px;letter-spacing:.02em;}
.board-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--muted);margin-bottom:8px;}

.threads{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.thread{display:flex;align-items:center;gap:16px;padding:15px 18px;cursor:pointer;
  background:linear-gradient(155deg,rgba(20,17,28,.9),rgba(12,10,18,.8));border:1px solid var(--border);border-radius:8px;
  transition:transform .15s,border-color .15s;}
.thread:hover{transform:translateX(3px);border-color:var(--border2);}
.thread .t-main{flex:1;min-width:0;}
.thread .t-title{font-family:'Cinzel',serif;font-size:15px;color:var(--text);letter-spacing:.02em;display:flex;align-items:center;gap:9px;}
.thread .pin{font-size:11px;color:var(--forum);}
.thread .t-meta{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--muted);margin-top:4px;}
.thread .t-meta b{font-style:normal;color:var(--gold);font-weight:600;}
.thread .t-count{text-align:center;flex-shrink:0;padding-left:14px;border-left:1px solid var(--border);}
.thread .t-count .n{font-family:'Cinzel',serif;font-size:21px;color:var(--goldL);line-height:1;}
.thread .t-count .l{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldD);margin-top:4px;}

/* COMPOSER */
.composer{background:linear-gradient(165deg,rgba(24,19,32,.92),rgba(12,10,18,.86));border:1px solid var(--border2);border-radius:10px;padding:18px;margin-top:20px;}
.composer h3{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldL);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.composer h3::before{content:"\270D";color:var(--forum);font-size:15px;}
.fld{display:block;width:100%;background:rgba(6,4,14,.7);border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-family:'EB Garamond',serif;font-size:15px;padding:11px 13px;margin-bottom:11px;transition:border-color .15s,box-shadow .15s;resize:vertical;}
.fld::placeholder{color:var(--mute2);font-style:italic;}
.fld:focus{outline:none;border-color:var(--forum);box-shadow:0 0 0 3px rgba(207,125,99,.12);}
textarea.fld{min-height:96px;line-height:1.55;}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.hint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5px;color:var(--mute2);}
.btn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  padding:11px 20px;border-radius:5px;border:1px solid color-mix(in srgb,var(--forum) 55%,transparent);
  background:linear-gradient(180deg,rgba(207,125,99,.22),rgba(207,125,99,.06));color:var(--goldL);transition:all .15s;}
.btn:hover{background:linear-gradient(180deg,rgba(207,125,99,.34),rgba(207,125,99,.12));box-shadow:0 0 18px rgba(207,125,99,.2);}
.btn.ghost{border-color:var(--border);background:rgba(201,168,74,.04);color:var(--muted);}
.btn.ghost:hover{color:var(--goldL);border-color:var(--border2);box-shadow:none;background:rgba(201,168,74,.08);}
.btn.danger{border-color:rgba(192,57,43,.4);background:rgba(192,57,43,.08);color:#d98a7a;}
.btn.danger:hover{background:rgba(192,57,43,.18);box-shadow:none;}
.btn.small{padding:6px 12px;font-size:9px;}

/* THREAD VIEW / POSTS */
.posts{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
.post{position:relative;background:linear-gradient(160deg,rgba(20,17,28,.9),rgba(12,10,18,.82));border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.post.op{border-color:var(--border2);box-shadow:inset 3px 0 0 var(--forum);}
.post-h{display:flex;align-items:center;gap:11px;margin-bottom:9px;}
.post-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:#1a0800;background:radial-gradient(circle at 35% 30%,#f0cc72,#c9a84c 55%,#7c5a1f);box-shadow:0 0 0 1px #7c5a1f;}
.post-av.keeper{background:radial-gradient(circle at 35% 30%,#f3b79a,#cf7d63 55%,#7c3a28);box-shadow:0 0 0 1px #7c3a28;}
.post-who{font-family:'Cinzel',serif;font-size:13px;color:var(--goldL);letter-spacing:.03em;}
.post-who .tag{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--forum);border:1px solid rgba(207,125,99,.4);border-radius:8px;padding:1px 6px;margin-left:7px;vertical-align:middle;}
.post-when{margin-left:auto;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5px;color:var(--mute2);}
.post-body{font-size:15.5px;line-height:1.62;color:#dcd4c2;white-space:normal;word-wrap:break-word;}
.post-body strong{color:var(--goldL);font-weight:600;}
.post-body em{color:#d8c9a8;}
.post-actions{margin-top:11px;display:flex;gap:8px;}

/* EMPTY STATE */
.empty{text-align:center;padding:42px 20px;border:1px dashed var(--border);border-radius:10px;margin-top:18px;background:rgba(201,168,74,.02);}
.empty .e-ic{font-size:30px;color:var(--goldD);margin-bottom:12px;}
.empty .e-t{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.06em;color:var(--goldL);}
.empty .e-s{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);margin-top:7px;}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:50;opacity:0;pointer-events:none;
  background:rgba(10,7,18,.96);border:1px solid var(--border2);border-radius:7px;padding:11px 20px;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;color:var(--goldL);transition:all .25s;box-shadow:0 12px 30px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:560px){
  .hero{padding:46px 0 18px;}
  .home-link{position:static;display:inline-flex;margin-bottom:20px;}
  .thread{flex-direction:row;}
  .thread .t-count{padding-left:10px;}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="hero">
    <div class="home-link" onclick="goHome()">&larrhk; The Grand Archive</div>
    <div class="eyebrow">Forum of the Custodians</div>
    <h1>The Commons</h1>
    <div class="tagline">A gathering-hall for everyone who keeps the Archive — open a thread, answer one, and argue the lore.</div>
    <div class="rule"></div>
    <div class="whoami" id="whoami"></div>
  </div>

  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════
   THE COMMONS — local-first forum for the Archive.
   Posts live in this browser only (localStorage). No server.
   Identity is read from the Archive's Custodian sign-in when present.
════════════════════════════════════════════════ */
(function(){
  var STORE='arsh_forum_v1', GUEST='arsh_forum_guest';

  var BOARDS=[
    {id:'war-table',   name:'The War Table',        c:'#c0392b', ic:'\u265F', desc:'Strategium, tactics, and the wargame — strategies, match reports, and challenges.'},
    {id:'loremasters', name:'Loremasters\u2019 Hall', c:'#9370b0', ic:'\u2726', desc:'Canon, worldbuilding, and the deep lore of the Talean world.'},
    {id:'scriptorium', name:'The Scriptorium Annex', c:'#b67849', ic:'\u270D', desc:'The novels, drafts, and the craft of writing Arshmunnu.'},
    {id:'cartograph',  name:'Cartographers\u2019 Table', c:'#5A8B5A', ic:'\u2694', desc:'Maps, campaigns, and tales from the tabletop.'},
    {id:'tavern',      name:'The Tavern',           c:'#c9a84c', ic:'\u2728', desc:'Introductions, idle talk, and everything else.'}
  ];
  var BMAP={}; BOARDS.forEach(function(b){BMAP[b.id]=b;});

  /* ---------- storage ---------- */
  function load(){try{return JSON.parse(localStorage.getItem(STORE))||{threads:{},seed:0};}catch(e){return {threads:{},seed:0};}}
  function save(d){try{localStorage.setItem(STORE,JSON.stringify(d));}catch(e){toast('This browser refused to save — storage may be full or blocked.');}}
  var DB=load();

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  /* ---------- identity (reads the Archive account) ---------- */
  function currentUser(){
    var key='',accts={};
    try{key=localStorage.getItem('arsh_session')||'';}catch(e){}
    try{accts=JSON.parse(localStorage.getItem('arsh_accounts'))||{};}catch(e){}
    if(key&&accts[key]){return {key:key,name:accts[key].name,admin:!!accts[key].admin,signed:true};}
    var g='';try{g=localStorage.getItem(GUEST)||'';}catch(e){}
    if(g)return {key:'guest:'+g.toLowerCase(),name:g,admin:false,signed:false};
    return null;
  }
  function setGuestName(){
    var n=prompt('Choose a name to post under in the Commons.\n(For a permanent identity, sign in through the Grand Archive.)','');
    if(n==null)return;
    n=n.trim().slice(0,24);
    if(!n)return;
    try{localStorage.setItem(GUEST,n);}catch(e){}
    renderWho();render();
    toast('Posting as '+n+'.');
  }

  /* ---------- helpers ---------- */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmt(s){ // escape, then light markdown: **bold**, *italic*, newlines
    var h=esc(s);
    h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    return h.replace(/\n/g,'<br>');
  }
  function ago(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60)return 'just now';
    var m=Math.floor(s/60);if(m<60)return m+(m===1?' minute':' minutes')+' ago';
    var h=Math.floor(m/60);if(h<24)return h+(h===1?' hour':' hours')+' ago';
    var d=Math.floor(h/24);if(d<30)return d+(d===1?' day':' days')+' ago';
    var mo=Math.floor(d/30);if(mo<12)return mo+(mo===1?' month':' months')+' ago';
    return Math.floor(mo/12)+' yr ago';
  }
  function whenFull(ts){try{return new Date(ts).toLocaleString();}catch(e){return '';}}
  function initials(n){return (n&&n[0]?n[0]:'?').toUpperCase();}

  function threadsOf(board){
    var out=[];for(var id in DB.threads){if(DB.threads[id].board===board)out.push(DB.threads[id]);}
    out.sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)|| b.last-a.last;});
    return out;
  }
  function lastActivity(board){
    var t=0;for(var id in DB.threads){var th=DB.threads[id];if(th.board===board&&th.last>t)t=th.last;}
    return t;
  }
  function counts(board){
    var th=0,po=0;for(var id in DB.threads){var t=DB.threads[id];if(t.board===board){th++;po+=t.posts.length;}}
    return {threads:th,posts:po};
  }

  /* ---------- view state ---------- */
  var view={name:'boards',board:null,thread:null};
  var viewEl=document.getElementById('view');
  var whoEl=document.getElementById('whoami');

  function renderWho(){
    var u=currentUser();
    if(u){
      whoEl.innerHTML='<span class="seal">'+esc(initials(u.name))+'</span>'
        +'Posting as <b class="'+(u.admin?'keeper':'')+'">'+esc(u.name)+'</b>'
        +(u.admin?' &mdash; <span class="keeper">Keeper of the Archive</span>':(u.signed?'':' <span class="setname" id="rename">change name</span>'));
    }else{
      whoEl.innerHTML='<span>Sign in through the Archive to post under your name, or </span><span class="setname" id="rename">choose a name</span>';
    }
    var r=document.getElementById('rename');if(r)r.addEventListener('click',setGuestName);
  }

  function render(){
    if(view.name==='thread'&&(!view.thread||!DB.threads[view.thread]))view={name:'board',board:view.board};
    if(view.name==='boards')renderBoards();
    else if(view.name==='board')renderBoard(view.board);
    else if(view.name==='thread')renderThread(view.thread);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  /* ---------- boards ---------- */
  function renderBoards(){
    var total=0;for(var id in DB.threads)total++;
    var h='<div class="sec-h"><span class="stitle">The Halls</span><span class="sline"></span><span class="scount">'+total+' thread'+(total===1?'':'s')+'</span></div>';
    h+='<div class="halls">';
    BOARDS.forEach(function(b){
      var c=counts(b.id),la=lastActivity(b.id);
      h+='<div class="hall" style="--c:'+b.c+'" data-board="'+b.id+'" tabindex="0" role="button">'
        +'<div class="hall-ic">'+b.ic+'</div>'
        +'<div class="hall-body"><div class="hall-name">'+esc(b.name)+'</div>'
        +'<div class="hall-desc">'+esc(b.desc)+'</div>'
        +'<div class="hall-meta"><span>'+c.threads+' thread'+(c.threads===1?'':'s')+'</span><span>'+c.posts+' post'+(c.posts===1?'':'s')+'</span>'
        +(la?'<span class="last">last '+ago(la)+'</span>':'<span class="last">no posts yet</span>')+'</div></div></div>';
    });
    h+='</div>';
    viewEl.innerHTML=h;
    viewEl.querySelectorAll('.hall').forEach(function(el){
      el.addEventListener('click',function(){view={name:'board',board:el.dataset.board};render();});
      el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}});
    });
  }

  /* ---------- single board (thread list + new thread) ---------- */
  function renderBoard(boardId){
    var b=BMAP[boardId];if(!b){view={name:'boards'};return renderBoards();}
    var list=threadsOf(boardId);
    var h='<div class="crumb"><span class="back" id="back">&larrhk; All halls</span><span class="dot">/</span><span class="crumb-here">'+esc(b.name)+'</span></div>';
    h+='<div class="board-title" style="color:'+b.c+'">'+esc(b.name)+'</div><div class="board-sub">'+esc(b.desc)+'</div>';

    h+='<div class="composer"><h3>Start a thread</h3>'
      +'<input class="fld" id="nt-title" maxlength="120" placeholder="A title for your thread">'
      +'<textarea class="fld" id="nt-body" maxlength="6000" placeholder="Say your piece…  (**bold**, *italic*, and line breaks are kept)"></textarea>'
      +'<div class="composer-row"><span class="hint">Posts are kept in this browser only.</span>'
      +'<button class="btn" id="nt-post">Post thread</button></div></div>';

    if(!list.length){
      h+='<div class="empty"><div class="e-ic">'+b.ic+'</div><div class="e-t">No threads in '+esc(b.name)+' yet</div>'
        +'<div class="e-s">Be the first to raise a banner here.</div></div>';
    }else{
      h+='<div class="sec-h"><span class="stitle">Threads</span><span class="sline"></span><span class="scount">'+list.length+'</span></div>';
      h+='<div class="threads">';
      list.forEach(function(t){
        var replies=t.posts.length-1;
        h+='<div class="thread" data-id="'+t.id+'"><div class="t-main">'
          +'<div class="t-title">'+(t.pin?'<span class="pin">\u2605</span>':'')+esc(t.title)+'</div>'
          +'<div class="t-meta">by <b>'+esc(t.author)+'</b> &middot; started '+ago(t.ts)+' &middot; last reply '+ago(t.last)+'</div>'
          +'</div><div class="t-count"><div class="n">'+replies+'</div><div class="l">'+(replies===1?'reply':'replies')+'</div></div></div>';
      });
      h+='</div>';
    }
    viewEl.innerHTML=h;
    document.getElementById('back').addEventListener('click',function(){view={name:'boards'};render();});
    document.getElementById('nt-post').addEventListener('click',function(){postThread(boardId);});
    viewEl.querySelectorAll('.thread').forEach(function(el){
      el.addEventListener('click',function(){view={name:'thread',board:boardId,thread:el.dataset.id};render();});
    });
  }

  function postThread(boardId){
    var u=currentUser();
    if(!u){setGuestName();return;}
    var title=document.getElementById('nt-title').value.trim();
    var body=document.getElementById('nt-body').value.trim();
    if(!title){toast('Give your thread a title.');document.getElementById('nt-title').focus();return;}
    if(!body){toast('Write something first.');document.getElementById('nt-body').focus();return;}
    var now=Date.now(),id=uid();
    DB.threads[id]={id:id,board:boardId,title:title,author:u.name,authorKey:u.key,keeper:u.admin,ts:now,last:now,pin:false,
      posts:[{id:uid(),author:u.name,authorKey:u.key,keeper:u.admin,ts:now,body:body}]};
    save(DB);
    view={name:'thread',board:boardId,thread:id};render();
    toast('Thread posted.');
  }

  /* ---------- thread view (posts + reply) ---------- */
  function renderThread(threadId){
    var t=DB.threads[threadId];if(!t){view={name:'board',board:view.board};return render();}
    var b=BMAP[t.board], me=currentUser();
    var h='<div class="crumb"><span class="back" id="back">&larrhk; '+esc(b.name)+'</span><span class="dot">/</span><span class="crumb-here">Thread</span></div>';
    h+='<div class="board-title" style="font-size:clamp(22px,3.6vw,32px);color:'+b.c+'">'+esc(t.title)+'</div>';
    h+='<div class="board-sub">'+(t.posts.length-1)+' '+((t.posts.length-1)===1?'reply':'replies')+' &middot; in '+esc(b.name)+'</div>';

    h+='<div class="posts">';
    t.posts.forEach(function(p,i){
      var canDel=me&&(me.key===p.authorKey||me.admin);
      h+='<div class="post'+(i===0?' op':'')+'">'
        +'<div class="post-h"><span class="post-av'+(p.keeper?' keeper':'')+'">'+esc(initials(p.author))+'</span>'
        +'<span class="post-who">'+esc(p.author)+(p.keeper?'<span class="tag">Keeper</span>':'')+'</span>'
        +'<span class="post-when" title="'+esc(whenFull(p.ts))+'">'+(i===0?'':'replied ')+ago(p.ts)+'</span></div>'
        +'<div class="post-body">'+fmt(p.body)+'</div>'
        +(canDel?'<div class="post-actions"><button class="btn danger small" data-del="'+p.id+'">'+(i===0?'Delete thread':'Delete')+'</button></div>':'')
        +'</div>';
    });
    h+='</div>';

    h+='<div class="composer" style="margin-top:22px"><h3>Reply</h3>'
      +'<textarea class="fld" id="rp-body" maxlength="6000" placeholder="Add your reply…"></textarea>'
      +'<div class="composer-row"><span class="hint">'+(me?('Replying as '+esc(me.name)):'Choose a name to reply')+'</span>'
      +'<button class="btn" id="rp-post">Post reply</button></div></div>';

    viewEl.innerHTML=h;
    document.getElementById('back').addEventListener('click',function(){view={name:'board',board:t.board};render();});
    document.getElementById('rp-post').addEventListener('click',function(){postReply(threadId);});
    viewEl.querySelectorAll('[data-del]').forEach(function(el){
      el.addEventListener('click',function(){delPost(threadId,el.dataset.del);});
    });
  }

  function postReply(threadId){
    var u=currentUser();if(!u){setGuestName();return;}
    var t=DB.threads[threadId];if(!t)return;
    var body=document.getElementById('rp-body').value.trim();
    if(!body){toast('Write a reply first.');return;}
    var now=Date.now();
    t.posts.push({id:uid(),author:u.name,authorKey:u.key,keeper:u.admin,ts:now,body:body});
    t.last=now;save(DB);render();
    toast('Reply posted.');
  }

  function delPost(threadId,postId){
    var t=DB.threads[threadId];if(!t)return;
    var me=currentUser();if(!me)return;
    var idx=-1;for(var i=0;i<t.posts.length;i++)if(t.posts[i].id===postId){idx=i;break;}
    if(idx<0)return;
    var p=t.posts[idx];
    if(me.key!==p.authorKey&&!me.admin){toast('You can only remove your own posts.');return;}
    if(idx===0){
      if(!confirm('Delete this whole thread and all its replies?'))return;
      delete DB.threads[threadId];save(DB);
      view={name:'board',board:t.board};render();toast('Thread deleted.');
    }else{
      if(!confirm('Delete this reply?'))return;
      t.posts.splice(idx,1);t.last=t.posts[t.posts.length-1].ts;save(DB);render();toast('Reply deleted.');
    }
  }

  /* ---------- toast ---------- */
  var toastEl=document.getElementById('toast'),toastT=null;
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},2400);}

  /* ---------- seed a little life on first run ---------- */
  function seed(){
    if(DB.seed&&DB.seed>=1)return;
    var t0=Date.now()-1000*60*60*38, t1=Date.now()-1000*60*60*5, t2=Date.now()-1000*60*42;
    var welcome=uid();
    DB.threads[welcome]={id:welcome,board:'tavern',title:'Welcome to the Commons',author:'Aelarion',authorKey:'aelarion',keeper:true,ts:t0,last:t1,pin:true,
      posts:[
        {id:uid(),author:'Aelarion',authorKey:'aelarion',keeper:true,ts:t0,
         body:"Custodians — this is the Commons, the meeting-hall of the Archive.\n\nFive halls stand open: the **War Table** for Strategium, the **Loremasters\u2019 Hall** for canon and worldbuilding, the **Scriptorium Annex** for the novels, the **Cartographers\u2019 Table** for campaigns, and this **Tavern** for all else.\n\nA word on how it works: everything you post is kept *only in your own browser* — there is no server, and nothing leaves your device. Sign in through the Archive and your threads will carry your Custodian name. Speak freely."},
        {id:uid(),author:'Aelarion',authorKey:'aelarion',keeper:true,ts:t1,
         body:"Formatting, briefly: wrap a word in **double stars** for emphasis, a single *star* for a softer note, and your line breaks are kept as written."}
      ]};
    var wt=uid();
    DB.threads[wt]={id:wt,board:'war-table',title:'Opening gambits on the 10\u00d710 board',author:'Aelarion',authorKey:'aelarion',keeper:true,ts:t2,last:t2,pin:false,
      posts:[{id:uid(),author:'Aelarion',authorKey:'aelarion',keeper:true,ts:t2,
        body:"Now that Strategium has an Impossible engine and online play, share your openings. I favour an early Mage push to break the spearline before committing the Catapult — what do you run?"}]};
    DB.seed=1;save(DB);
  }

  /* ---------- home link (works inside the Archive iframe or standalone) ---------- */
  window.goHome=function(){
    try{ if(window.parent&&window.parent!==window&&typeof window.parent.openApp==='function'){window.parent.openApp('home');return;} }catch(e){}
    window.location.href='index.html';
  };

  seed();
  renderWho();render();
  /* keep identity fresh if the user signs in via the Archive in another moment */
  window.addEventListener('focus',function(){renderWho();});
})();

/* ambient starfield (shared house style) */
(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d'),stars=[];
  function size(){c.width=innerWidth;c.height=innerHeight;stars=[];var n=Math.min(120,Math.floor(innerWidth*innerHeight/14000));
    for(var i=0;i<n;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,a:Math.random()*6.28,s:Math.random()*.015+.004});}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(function(st){st.a+=st.s;ctx.globalAlpha=Math.abs(Math.sin(st.a))*.6+.1;ctx.fillStyle='#e8dfc8';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  addEventListener('resize',size);size();draw();
})();
</script>
</body>
